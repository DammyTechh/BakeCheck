; mypy configuration for the BreadGuard AI vision service.
;
; Run: python -m mypy app
;
; The point of committing this rather than passing --ignore-missing-imports on
; the command line is that a blanket flag also silences a genuinely missing
; import — a typo in a module name, or a dependency that was never added to
; requirements.txt, would type-check clean. Naming the untyped libraries one by
; one means an unknown import is still an error.

[mypy]
python_version = 3.12
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
strict_equality = True
check_untyped_defs = True
; Silencing an error needs a code, so a broad `# type: ignore` cannot creep in.
enable_error_code = ignore-without-code

; ── Third-party libraries that ship no type information ──────────────────────
;
; None of these publish stubs or a py.typed marker. Their absence is a fact
; about the ecosystem, not about this code, so each is listed explicitly.

; OpenCV. Stubs exist on PyPI (opencv-stubs) but lag the release this service
; pins, and a wrong stub is worse than none.
[mypy-cv2.*]
ignore_missing_imports = True

; scikit-learn. No py.typed as of 1.9; its own CI does not type-check.
[mypy-sklearn.*]
ignore_missing_imports = True

; joblib, used only to persist and load model artifacts.
[mypy-joblib.*]
ignore_missing_imports = True

; NumPy ships types, but only when installed with its stubs present. Keep this
; narrow: it covers the import, not the array operations, which stay checked
; wherever a return type is annotated.
[mypy-numpy.*]
ignore_missing_imports = True

[mypy-PIL.*]
ignore_missing_imports = True
